version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    # Fetch every workspace manifest so npm keeps its complete dependency graph.
    # React 18 fixtures and React 19 consumers must stay on their current majors.
    # Minor/patch updates remain enabled; major migrations need explicit review.
    ignore:
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
    groups:
      tiptap:
        patterns: ["@tiptap/*"]
      desktop-runtime:
        patterns: ["electron", "electron-builder", "electron-updater"]
      test-toolchain:
        patterns: ["vitest", "vite", "@vitejs/*", "esbuild"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
