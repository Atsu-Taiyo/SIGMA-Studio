version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      tiptap:
        patterns: ["@tiptap/*"]
      desktop-runtime:
        patterns: ["electron", "electron-builder", "electron-updater"]
      test-toolchain:
        patterns: ["vitest", "vite", "@vitejs/*", "esbuild"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
