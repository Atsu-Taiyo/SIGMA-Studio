version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    # This fixture must keep exercising React 18 while the desktop uses React 19.
    # Exclude only its manifest; runtime dependencies remain eligible for updates.
    exclude-paths:
      - "tests/fixtures/editor-react18/package.json"
    groups:
      tiptap:
        patterns: ["@tiptap/*"]
      desktop-runtime:
        patterns: ["electron", "electron-builder", "electron-updater"]
      test-toolchain:
        patterns: ["vitest", "vite", "@vitejs/*", "esbuild"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
