name: Desktop PDF parity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf-parity:
    name: B4 three-column PDF (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build the actual desktop renderer, main and preload
        run: npm --workspace @sigma-studio/desktop run electron:prepare
      - name: Compare editor, preview and saved vector PDF at 100%, 125% and 150% display scale
        run: npm --workspace @sigma-studio/desktop run test:e2e:electron -- tests/electron/pdf-b4-columns.spec.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pdf-parity-${{ matrix.os }}
          path: apps/desktop/test-results/
          retention-days: 7
