name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop build and checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm run lockfile:check
      - run: npm ci
      - run: npm run dependencies:check
      - run: npm run version:check
      - run: npm run test:scripts
      - run: python3 -m unittest discover -s scripts -p 'windows_store*_test.py'
      - run: npm exec --workspace @sigma-studio/desktop -- next typegen
      - run: npm run typecheck
      - run: npm run lint
      # Source-graph scans and real filesystem tests exceed 5s on shared runners.
      - run: npm --workspace @sigma-studio/desktop run test -- --maxWorkers=2 --testTimeout=30000
      - run: npm run build
      - run: npm run electron:build

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm run lockfile:check
      - run: npm ci
      # Includes build/test dependencies: compromised tooling can affect releases.
      - run: npm run dependencies:check
      - run: npm run security:audit

  electron-smoke:
    name: Electron persistence and IPC smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm run lockfile:check
      - run: npm ci
      - run: npm run dependencies:check
      - run: npm exec --workspace @sigma-studio/desktop -- playwright install --with-deps chromium
      - name: Build the static desktop renderer and actual main/preload
        run: npm --workspace @sigma-studio/desktop run electron:prepare
      - name: Allow the installed Electron binary to create its Linux sandbox
        # Ubuntu restricts unprivileged user namespaces by executable path. The
        # npm runtime has no system package profile; keep the host restriction
        # and permit only this job's Electron, as packaged Electron apps do.
        run: |
          # Electron may download its binary on first require and log to stdout.
          # Keep that install output separate from the executable path.
          electron_path_file="$RUNNER_TEMP/sigma-electron-path"
          node -e 'require("node:fs").writeFileSync(process.argv[1], require("electron"))' "$electron_path_file"
          electron_binary="$(cat "$electron_path_file")"
          test -x "$electron_binary"
          profile="$RUNNER_TEMP/sigma-electron.apparmor"
          cat > "$profile" <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile sigma-electron-ci "$electron_binary" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser --replace "$profile"
      - name: Exercise native IPC, approval, graph crop, overlay editing, page-column side notes, and persistence
        # The shared-document fixture encrypts its fake login through safeStorage.
        # Give headless Linux a real Secret Service instead of a plaintext backend.
        run: |
          sudo apt-get update
          sudo apt-get install --yes gnome-keyring
          xvfb-run --auto-servernum dbus-run-session -- bash -euo pipefail -c '
            printf "%s" "sigma-ci-fixture" | gnome-keyring-daemon --daemonize --components=secrets --unlock >/dev/null
            export XDG_CURRENT_DESKTOP=GNOME
            npm run test:e2e:electron -- \
              tests/electron/ai-svg-conversion.spec.ts \
              tests/electron/open-document.spec.ts tests/electron/ipc-sender-security.spec.ts \
              tests/electron/file-names.spec.ts tests/electron/ai-inline-approval.spec.ts \
              tests/electron/math-ime-placeholder.spec.ts \
              tests/electron/whiteboard-focus.spec.ts tests/electron/graph-crop.spec.ts \
              tests/electron/overlay-text-input-latency.spec.ts tests/electron/browser-sidebar.spec.ts \
              tests/electron/overlay-math-box-toggle.spec.ts tests/electron/boxed-text-corners.spec.ts \
              tests/electron/boxed-text-run-joins.spec.ts \
              tests/electron/large-library-editing.spec.ts \
              tests/electron/shared-lazy-open.spec.ts \
              tests/electron/problem-display.spec.ts tests/electron/whiteboard-image-save.spec.ts \
              tests/electron/small-shape-handles.spec.ts \
              tests/electron/page-column-side-notes.spec.ts \
              tests/electron/shared-split-pane-save.spec.ts \
              tests/electron/svg-to-sigma.spec.ts tests/electron/box-custom-frame.spec.ts \
              tests/electron/problem-custom-frame.spec.ts tests/electron/problem-frame-ai-chat.spec.ts \
              tests/electron/problem-tags-ime.spec.ts \
              tests/electron/graph-axis-end.spec.ts tests/electron/pdf-math-fonts.spec.ts \
              tests/electron/ai-image-annotation.spec.ts tests/electron/ai-proposal-merge.spec.ts \
              tests/electron/overlay-mode-switch-position.spec.ts \
              tests/electron/ai-svg-figure.spec.ts tests/electron/extensions-dialog.spec.ts \
              tests/electron/close-right-after-shape-edit.spec.ts \
              tests/electron/shared-sync-rejected.spec.ts \
              tests/electron/extensions-menu.spec.ts \
              tests/electron/local-fonts-menu.spec.ts tests/electron/math-ime-composition-scroll.spec.ts \
              tests/electron/graph-expression-backspace.spec.ts tests/electron/math-unclosed-paren.spec.ts \
              tests/electron/quote-empty-paragraph-delete.spec.ts
          '
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: electron-smoke-failure
          path: apps/desktop/test-results/
          retention-days: 7

  public-packages:
    name: Public package build and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm run lockfile:check
      - run: npm ci
      # Viewer declarations must exist before Editor's public contract checks.
      - run: npm run editor:build
      - run: npm run viewer:typecheck
      - run: npm run editor:typecheck
      - run: npm run viewer:test
      - run: npm --workspace @sigma-studio/editor run test
      - run: npm --workspace @sigma-studio/editor-react18-fixture run build
      - run: npm --workspace @sigma-studio/editor-react19-example run build
      - run: npm exec --workspace @sigma-studio/desktop -- playwright install --with-deps chromium
      - run: npm run test:public-browser
      - run: npm run test:public-browser:react18
      - name: Inspect the public tarballs without publishing
        run: npm pack --workspace @sigma-studio/viewer --workspace @sigma-studio/editor --dry-run --ignore-scripts

  file-lock:
    name: File locking (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm run lockfile:check
      - run: npm ci
      - name: Verify ownership and real process recovery
        run: npm --workspace @sigma-studio/desktop run test -- file-lock
      - name: Load the native lock in the shipped Electron runtime
        run: npm exec --workspace @sigma-studio/desktop -- cross-env ELECTRON_RUN_AS_NODE=1 electron scripts/check-native-lock.cjs
