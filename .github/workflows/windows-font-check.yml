name: Windows font and clipboard checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-font-check.yml'
      - 'apps/desktop/**'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - '.github/workflows/windows-font-check.yml'
      - 'apps/desktop/**'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: windows-font-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  font-and-clipboard:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the static desktop application
        run: pnpm --filter @sigma-studio/desktop run electron:prepare
      - name: Verify sizes, native copy/paste, persistence, and app restart
        run: pnpm --filter @sigma-studio/desktop run test:e2e:electron font-size.spec.ts font-size-copy-pages.spec.ts font-format-roundtrip.spec.ts clipboard-routing.spec.ts problem-display.spec.ts whiteboard-image-save.spec.ts spreadsheet-paste.spec.ts --reporter=list,html
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-font-and-clipboard-results
          path: |
            apps/desktop/test-results
            apps/desktop/playwright-report
          retention-days: 7
