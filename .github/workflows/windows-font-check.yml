name: Windows font and clipboard checks

on:
  pull_request:
    paths:
      - '.github/workflows/windows-font-check.yml'
      - 'apps/desktop/**'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: windows-font-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  font-and-clipboard:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build the static desktop application
        run: npm --workspace @sigma-studio/desktop run electron:prepare
      - name: Verify sizes, native copy/paste, persistence, and app restart
        run: npm --workspace @sigma-studio/desktop run test:e2e:electron -- font-size.spec.ts font-size-copy-pages.spec.ts --reporter=list,html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-font-and-clipboard-results
          path: |
            apps/desktop/test-results
            apps/desktop/playwright-report
          retention-days: 7
