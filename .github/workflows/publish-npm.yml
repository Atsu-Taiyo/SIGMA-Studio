name: Publish npm packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "検証後にnpmへ公開する（既定は検証のみ）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  packages:
    if: github.repository == 'Atsu-Taiyo/SIGMA-Studio'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate release ref and version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "手動実行はmainを選択してください。" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "タグとpackage versionが一致しません。" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify workspace versions
        run: pnpm run version:check

      - name: Build packages and verify public contracts
        run: |
          pnpm run test:scripts
          pnpm run editor:build
          pnpm run viewer:typecheck
          pnpm run editor:typecheck
          pnpm run viewer:test
          pnpm --filter @sigma-studio/editor run test
          pnpm --filter @sigma-studio/editor-react18-fixture run build
          pnpm --filter @sigma-studio/editor-react19-example run build
      - name: Verify React 19 and React 18 integration
        run: |
          pnpm --filter @sigma-studio/desktop exec playwright install --with-deps chromium
          pnpm run test:public-browser
          pnpm run test:public-browser:react18

      - name: Pack the tested output
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/npm-packages"
          pnpm --filter @sigma-studio/viewer --filter @sigma-studio/editor -r pack --config.ignore-scripts=true --pack-destination "$RUNNER_TEMP/npm-packages" --json > "$RUNNER_TEMP/npm-pack-result.json"
      - name: Audit the actual tarballs
        run: node scripts/audit-npm-tarballs.mjs "$RUNNER_TEMP/npm-packages"
        env:
          RELEASE_CONTENT_RULES: ${{ secrets.RELEASE_CONTENT_RULES }}

      # npm側で両packageのTrusted Publisherをこのrepo / publish-npm.ymlへ設定する。
      # 検証済みtgzをそのまま公開し、prepackによる再ビルドは行わない。
      - name: Publish Viewer then Editor using OIDC
        if: github.event_name == 'push' || inputs.publish
        shell: bash
        env:
          PUBLIC_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for package in viewer editor; do
            export SIGMA_NPM_PACKAGE="$package"
            status="$(node --input-type=module -e 'const response = await fetch("https://registry.npmjs.org/@sigma-studio%2f" + process.env.SIGMA_NPM_PACKAGE + "/" + process.env.PUBLIC_VERSION, { signal: AbortSignal.timeout(30000) }); if (response.status === 200) console.log("exists"); else if (response.status === 404) console.log("missing"); else throw new Error("Registry check failed: " + response.status)')"
            if [[ "$status" == "exists" ]]; then
              echo "@sigma-studio/${package}@${PUBLIC_VERSION} は公開済みのためskipします。"
            else
              pnpm publish "$RUNNER_TEMP/npm-packages/sigma-studio-${package}-${PUBLIC_VERSION}.tgz" --access public --ignore-scripts --no-git-checks
            fi
          done
      - name: Summarize verification
        if: success()
        env:
          PUBLIC_VERSION: ${{ steps.release.outputs.version }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          {
            echo "### npm packages ${PUBLIC_VERSION}"
            echo "Build, public contracts, React 19/18 and tarball audit passed."
            echo "Publication requested: ${PUBLISH_REQUESTED}"
          } >> "$GITHUB_STEP_SUMMARY"
