name: Prepare Windows Store package

# Manual packaging shares the same trusted steps as release CD.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Store用AppXを用意する公開済みReleaseタグ (v0.500.0など)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: prepare-windows-store-package
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    environment: windows-store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/prepare-store-package
        id: package
        with:
          release_tag: ${{ inputs.release_tag }}
          SIGMA_COLLABORATION_URL: ${{ secrets.SIGMA_COLLABORATION_URL }}
          SIGMA_SUPABASE_URL: ${{ secrets.SIGMA_SUPABASE_URL }}
          SIGMA_SUPABASE_ANON_KEY: ${{ secrets.SIGMA_SUPABASE_ANON_KEY }}
          RELEASE_CONTENT_RULES: ${{ secrets.RELEASE_CONTENT_RULES }}
          WINDOWS_STORE_IDENTITY_NAME: ${{ secrets.WINDOWS_STORE_IDENTITY_NAME }}
          WINDOWS_STORE_PUBLISHER: ${{ secrets.WINDOWS_STORE_PUBLISHER }}
          WINDOWS_STORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.WINDOWS_STORE_PUBLISHER_DISPLAY_NAME }}
