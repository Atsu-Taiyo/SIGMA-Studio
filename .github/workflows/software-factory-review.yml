name: Software Factory PR review

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'レビューするPR番号（外部投稿者のPRも保守者が指定可能）'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: software-factory-review-${{ github.event.workflow_run.head_sha || inputs.pull_request }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.repository == 'Atsu-Taiyo/SIGMA-Studio' && vars.SIGMA_FACTORY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      run_ai: ${{ steps.prepare.outputs.run_ai }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v9
        id: prepare
        env:
          HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' && 'true' || '' }}
        with:
          script: |
            const factory = await import(`${process.env.GITHUB_WORKSPACE}/.github/software-factory/github.mjs`);
            await factory.preparePrReview({github, context, core});
      - uses: actions/upload-artifact@v7
        if: steps.prepare.outputs.run_ai == 'true'
        with:
          name: factory-pr-context
          path: .factory-output/context.json
          include-hidden-files: true
          retention-days: 14

  review:
    needs: prepare
    if: needs.prepare.outputs.run_ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: factory-pr-context
          path: .factory-output
      - name: Review PR data without checking out or executing the PR
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        timeout-minutes: 15
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: '0.163.0'
          model: ${{ vars.SIGMA_FACTORY_MODEL }}
          effort: high
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          allow-bots: 'true'
          allow-bot-users: ${{ vars.SIGMA_FACTORY_REVIEW_BOTS || 'dependabot[bot]' }}
          prompt-file: .github/software-factory/review.md
          output-schema-file: .github/software-factory/review.schema.json
          output-file: .factory-output/review.json
          codex-args: '["--ephemeral"]'
      - uses: actions/upload-artifact@v7
        with:
          name: factory-pr-review
          path: .factory-output/review.json
          include-hidden-files: true
          retention-days: 14

  publish:
    needs: [prepare, review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: factory-pr-context
          path: .factory-output
      - uses: actions/download-artifact@v7
        with:
          name: factory-pr-review
          path: .factory-output
      - uses: actions/github-script@v9
        with:
          script: |
            const factory = await import(`${process.env.GITHUB_WORKSPACE}/.github/software-factory/github.mjs`);
            await factory.publishPrReview({github, context, core});
