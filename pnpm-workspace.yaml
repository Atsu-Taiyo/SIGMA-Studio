packages:
  - apps/desktop
  - apps/web
  - packages/viewer
  - packages/editor
  - tests/fixtures/editor-react18
  - examples/editor-react19
linkWorkspacePackages: true
# Force inode sharing rather than APFS clones/copies between worktrees.
packageImportMethod: hardlink
# Apple Silicon release runners also package Intel macOS native dependencies.
supportedArchitectures:
  os: [current]
  cpu: [current, x64]
overrides:
  undici@^6: ^6.29.1
  undici@^7: ^7.30.1
  postcss: 8.5.33
  http-cache-semantics: 4.3.0
  # 1.43 changes DOM selection and clears composition before native history guards run.
  # Lift this pin when IME undo and continued-box selection pass with the newer view.
  prosemirror-view: 1.42.9
  '@next/eslint-plugin-next>fast-glob': npm:tinyglobby@0.2.17
  # pnpm import otherwise deduplicates npm's nested Node 24 typings into 26.
  '@types/cacheable-request>@types/node': 24.19.0
  '@types/fs-extra>@types/node': 24.19.0
  '@types/jsdom>@types/node': 24.19.0
  '@types/keyv>@types/node': 24.19.0
  '@types/qrcode>@types/node': 24.19.0
  '@types/responselike>@types/node': 24.19.0
  '@types/utif>@types/node': 24.19.0
  '@types/ws>@types/node': 24.19.0
  buffer-image-size>@types/node: 24.19.0
  happy-dom>@types/node: 24.19.0
  # Keep the npm @types/jsdom parser graph, including entities 8.1.0.
  '@types/jsdom>parse5': 8.0.1
# Preserve lifecycle scripts already present in the npm lockfile.
allowBuilds:
  electron-winstaller: true
  esbuild: true
  fsevents: true
  unrs-resolver: true
  workerd: true
# Electron packaging/native-lock tests and existing imports rely on hoisting.
nodeLinker: hoisted
